<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ChemPrep mark: the .tile wordmark from style.css, inverted onto a dark
       panel so it reads against both light and dark browser chrome. The "25"
       superscript of the full mark is dropped here — at 16px it muddies the
       "Ch". apple-touch-icon.png and og-image.png carry the complete mark. -->
  <rect width="64" height="64" rx="14" fill="#111417"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" fill="none" stroke="#2a3038" stroke-width="2.5"/>
  <text x="32" y="33" fill="#e8590c"
        font-family="'Iowan Old Style', Palatino, Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="central">Ch</text>
</svg>
