<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ChemPrep — Chemistry, from the basics to olympiad</title>
    <meta name="description" content="Interactive lessons from your first chemistry class up to olympiad level. Every topic starts with the basics and every answer is explained." />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- icons: SVG for modern browsers, 32px PNG fallback, 180px for iOS -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#111417" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord, iMessage).
         %SITE_URL% is substituted at build time — see vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChemPrep" />
    <meta property="og:title" content="ChemPrep — Chemistry, from the basics to olympiad" />
    <meta property="og:description" content="Interactive lessons from your first chemistry class up to olympiad level. Every topic starts with the basics and every answer is explained." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ChemPrep — high school chemistry you can run. A titration curve of a weak acid against a strong base, marked at the equivalence point." />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChemPrep — Chemistry, from the basics to olympiad" />
    <meta name="twitter:description" content="Interactive lessons from your first chemistry class up to olympiad level. Every topic starts with the basics and every answer is explained." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="ChemPrep — high school chemistry you can run. A titration curve of a weak acid against a strong base, marked at the equivalence point." />
  </head>
  <body>
    <div id="app" hidden>
      <!-- 25 sidebar items sit before the lesson; give keyboard users a way past them -->
      <a class="skip-link" href="#app-main">Skip to lesson content</a>
      <!-- Drawer toggle: display:none above the 900px breakpoint, so the
           desktop layout is untouched and this is never in the tab order there -->
      <button id="nav-toggle" type="button" aria-expanded="false" aria-controls="sidenav">Topics</button>
      <div id="nav-backdrop" hidden></div>
      <aside id="sidenav" role="navigation" aria-label="Main">
        <!-- #brand's label is injected as innerHTML (a decorative tile + wordmark),
             so its name is set explicitly here rather than inferred from that markup -->
        <button id="brand" type="button" title="Back to home" aria-label="ChemPrep — back to home"></button>
        <!-- Label is injected in main.ts (icon + platform-correct shortcut);
             the text here is what shows if the module never runs. -->
        <button id="search-link" type="button" aria-label="Search questions and topics">Search</button>
        <div id="mode-picker" role="group" aria-label="Competition mode"></div>
        <button id="menu-link" type="button">All Topics</button>
        <button id="progress-link" type="button">Your Progress</button>
        <nav id="nav-items" aria-label="Topic modules"></nav>
        <div id="progress-panel" role="group" aria-label="Progress and account"></div>
        <button id="home-link" type="button">Back to homepage</button>
      </aside>
      <!-- tabindex=-1 makes <main> the skip-link target and the focus landing
           point after a topic navigation (see updateTopicChrome in main.ts) -->
      <main id="app-main" tabindex="-1">
        <!-- One row, not two: the breadcrumb and the prereq band both answer
             "where am I / what should I have read", and each was a half-empty
             45px line above the lesson. CSS puts prereqs on the right. -->
        <div id="topic-chrome">
          <div id="topic-crumb"></div>
          <div id="topic-prereq"></div>
        </div>
        <div id="view"></div>
        <nav id="topic-footer" aria-label="Lesson navigation"></nav>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
